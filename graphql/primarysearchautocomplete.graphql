query primarySearchAutocomplete($allowCountries: String, $category: String, $count: Int, $country: String, $keywords: String!, $locale: String, $sortBy: String, $sortDir: String) {
  Catalog {
    searchStore(
      allowCountries: $allowCountries
      category: $category
      count: $count
      country: $country
      keywords: $keywords
      locale: $locale
      sortBy: $sortBy
      sortDir: $sortDir
    ) {
      elements {
        offerId: id
        sandboxId: namespace
        title
      }
      paging {
        total
      }
    }
  }
  ExternalCatalog {
    externalCatalogSearch(keyword: $keywords, count: $count) {
      elements {
        gameId
        title
        coverImageUrl
        url
        developerDisplayName
      }
      paging {
        total
      }
    }
  }
}